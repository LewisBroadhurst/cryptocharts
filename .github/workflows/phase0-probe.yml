name: Phase 0 probe

# Run by hand. Checks what Coinbase and Kraken let a browser page do: CORS, history depth, live streams, terms.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/phase0-probe.mjs
      - run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-probe
          path: out/
          retention-days: 14
